<!DOCTYPE html>
<html>
<head>
<title>广州奶娃学院</title>
<meta charset="utf-8">
<meta http-equiv="refresh" content="3;url=https://www.gzmtu.edu.cn">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f0f8ff;
    text-align:center;
    font-family:system-ui,sans-serif;
    padding-top:40px;
}
.box{
    max-width:600px;
    margin:0 auto;
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 4px 12px #00000018;
}
h1{
    color:#004494;
    margin-bottom:16px;
}
.desc{
    font-size:18px;
    color:#444;
    margin-bottom:24px;
}
.nailong{
    font-size:120px;
    margin:20px 0;
}
.tip{
    color:#888;
    margin-top:20px;
}
.btn{
    display:inline-block;
    margin-top:16px;
    padding:12px 28px;
    background:#004494;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>
<body>
<div class="box">
    <h1>🏫 广州奶娃学院</h1>
    <div class="nailong">🐲</div>
    <p class="desc">奶龙带你走进校门，前往广州航海学院官网</p>
    <p>⏳ 3秒后自动跳转...</p>
    <a class="btn" href="https://www.gzmtu.edu.cn">立刻进入广航官网</a>
    <p class="tip">趣味跳转页面 · 仅玩梗</p>
</div>
</body>
</html>
